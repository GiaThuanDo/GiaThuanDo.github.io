<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- NOTE 1: Tab title -->
  <title>Gia-Thuan Do (Nathan)</title>
  <!-- NOTE 2: Tab icon (optional). Put favicon.ico in the assets/ folder, or delete this line. -->
  <link rel="icon" href="assets/favicon.ico" />
  <link href="css/styles.css" rel="stylesheet" />
</head>
<body>

  <button id="menuToggle" class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-hero"></div>
      <div class="sidebar-inner">
        <!-- NOTE 3: PROFILE PHOTO. Save a square headshot in the MAIN folder named exactly profile.jpg
             (lowercase, no spaces). If it is missing, the initials "GD" show instead. -->
        <img class="profile-img fade-in" id="profileImg" src="profile.jpeg" alt="Profile Picture" />

        <!-- NOTE 4: NAME -->
        <h1>Gia-Thuan Do <span class="nick">(Nathan)</span></h1>

        <!-- NOTE 5: The text under your name is edited in js/scripts.js (SITE.intro) -->
        <p class="intro-text" id="intro"></p>

        <nav class="side-nav">
          <a class="nav-link" id="nav-edu" href="#education">Education</a>
          <a class="nav-link" id="nav-exp" href="#experience">Experience</a>
          <a class="nav-link" id="nav-skills" href="#skills">Skills</a>
          <a class="nav-link" id="nav-cert" href="#certifications">Certifications</a>
          <a class="nav-link" id="nav-award" href="#award">Awards</a>
          <a class="nav-link" id="nav-pub" href="#publication">Publications</a>
          <a class="nav-link" id="nav-port" href="#portfolio">Portfolio</a>
          <a class="nav-link" id="nav-act" href="#activities">Activities</a>
        </nav>

        <!-- NOTE 6: SOCIAL LINKS. Edit the two href values. Delete a whole <a>...</a> block to remove an icon. -->
        <div class="social-links">
          <a href="https://www.linkedin.com/in/giathuando/" target="_blank" rel="noopener" aria-label="LinkedIn">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/linkedin/linkedin-original.svg" alt="LinkedIn" />
          </a>
          <a href="mailto:2904krenthuan@gmail.com" aria-label="Email">
            <img src="https://img.icons8.com/ios-filled/50/ffffff/new-post.png" alt="Email" />
          </a>
        </div>
      </div>
    </aside>

    <div class="scrim" id="scrim"></div>

    <main class="content">
      <!-- NOTE 7: Section contents are filled in by js/scripts.js. Don't edit them here. -->
      <section id="education" class="card-section"><h2 id="edu-title">Education</h2><div id="edu-content"></div></section>
      <section id="experience" class="card-section"><h2 id="exp-title">Experience</h2><div id="exp-content"></div></section>
      <section id="skills" class="card-section"><h2 id="skills-title">Skills</h2><div id="skills-content"></div></section>
      <section id="certifications" class="card-section"><h2 id="cert-title">Certifications</h2><div id="cert-content"></div></section>
      <section id="award" class="card-section"><h2 id="award-title">Awards</h2><div id="award-content"></div></section>
      <section id="publication" class="card-section"><h2 id="pub-title">Publications</h2><div id="pub-content"></div></section>
      <section id="portfolio" class="card-section"><h2 id="portfolio-title">Portfolio</h2><div id="portfolio-content"></div></section>
      <section id="activities" class="card-section"><h2 id="act-title">Activities</h2><div id="act-content"></div></section>

      <!-- NOTE 8: Footer text -->
      <footer class="site-footer">Copyright &copy; Gia-Thuan Do 2026</footer>
    </main>
  </div>

  <script src="js/scripts.js"></script>
</body>
</html>
